<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đỗ Đăng Tuân</title>
    <meta
      name="description"
      content="Phiên bản CV của Đỗ Đăng Tuân. Phiên bản hiển thị được cấu hình trong versions.json."
    />
    <meta name="theme-color" content="#f1f3ec" />
    <meta name="version" content="1.1.0" />
    <meta name="build-date" content="2026-10-25" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --paper: #f5f2ea;
        --line: rgba(13, 17, 23, 0.16);
        --blue: #2b59ff;
        --ink: #0d1117;
        --muted: #5e6673;
        --sans:
          'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }

      .frame {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      .loading,
      .error {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        background: var(--paper);
      }

      .loading {
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
      }

      .loading.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid var(--line);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .error {
        z-index: 3;
        padding: 28px;
        text-align: center;
      }
      .error[hidden] {
        display: none;
      }
      .error strong {
        display: block;
        margin-bottom: 8px;
        font-size: 15px;
      }
      .error p {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .error a {
        color: var(--blue);
        font-weight: 600;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
        .loading {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <iframe
      class="frame"
      id="version-frame"
      src="v1.1.0/index.html"
      data-version="1.1.0"
      data-date="2026-10-25"
      title="CV theo phiên bản"
    ></iframe>

    <div class="loading" id="version-loading" aria-hidden="true">
      <span class="spinner"></span>
    </div>

    <div class="error" id="version-error" hidden>
      <div>
        <strong>Không đọc được phiên bản CV.</strong>
        <p id="version-error-text">
          Kiểm tra versions.json và thư mục phiên bản tương ứng.
        </p>
        <a href="v1.0.0/index.html">Mở bản mới nhất</a>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        var frame = document.getElementById('version-frame');
        var loading = document.getElementById('version-loading');
        var errorBox = document.getElementById('version-error');
        var errorText = document.getElementById('version-error-text');

        if (!frame || !loading || !errorBox || !errorText) return;

        var metaVersion = document.querySelector('meta[name="version"]');
        var metaDate = document.querySelector('meta[name="build-date"]');
        var fallbackVersion =
          frame.getAttribute('data-version') ||
          (metaVersion ? metaVersion.content : '');
        var fallbackDate =
          frame.getAttribute('data-date') || (metaDate ? metaDate.content : '');
        var fallbackPath = frame.getAttribute('src');
        var fallback = null;

        if (fallbackVersion && fallbackPath) {
          fallback = {
            version: fallbackVersion,
            date: fallbackDate,
            path: fallbackPath,
          };
        }

        var hideLoading = function () {
          loading.classList.add('is-hidden');
        };
        var showLoading = function () {
          loading.classList.remove('is-hidden');
        };
        frame.addEventListener('load', hideLoading);

        var showError = function (message) {
          hideLoading();
          errorText.textContent =
            message || 'Kiểm tra versions.json và thư mục phiên bản tương ứng.';
          errorBox.hidden = false;
        };

        var applyVersion = function (entry) {
          if (!entry || !entry.version) {
            showError();
            return;
          }

          var path = entry.path || 'v' + entry.version + '/index.html';

          errorBox.hidden = true;
          frame.title = 'CV Đỗ Đăng Tuân';

          if (frame.getAttribute('src') !== path) {
            showLoading();
            frame.src = path;
            return;
          }

          try {
            if (
              frame.contentDocument &&
              frame.contentDocument.readyState === 'complete'
            ) {
              hideLoading();
            }
          } catch (error) {
            hideLoading();
          }
        };

        var pickEntry = function (data) {
          var versions = Array.isArray(data.versions) ? data.versions : [];
          var display = data.display || 'latest';
          var match = null;

          if (display !== 'latest') {
            match =
              versions.filter(function (item) {
                return item.version === display;
              })[0] || null;
          }

          if (!match && data.latest) {
            match =
              versions.filter(function (item) {
                return item.version === data.latest;
              })[0] || null;
          }

          return match || versions[0] || null;
        };

        window.setTimeout(hideLoading, 2500);

        fetch('versions.json', { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (data) {
            var entry = pickEntry(data);
            if (!entry) throw new Error('versions.json has no versions');
            applyVersion(entry);
          })
          .catch(function () {
            if (fallback) {
              applyVersion(fallback);
            } else {
              showError(
                'Kiểm tra versions.json và thư mục phiên bản tương ứng.',
              );
            }
          });
      })();
    </script>
  </body>
</html>
